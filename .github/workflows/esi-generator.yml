name: ESI API Generator
on:
  # push:
  #   branches: ['**'] # Matches any branch
  schedule:
    - cron: '5 11 * * *' # Runs at 11:05 UTC daily
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  generate-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的 git 历史
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install OpenAPI Generator
        run: |
          npm install @openapitools/openapi-generator-cli -g
      - name: Download OpenAPI specification
        run: |
          curl https://esi.evetech.net/latest/swagger.json -o swagger.json
      - name: Generate API Client
        run: |
          openapi-generator-cli generate \
            -i swagger.json \
            -g typescript-axios \
            -o src/api/esi \
            --minimal-update \
            --additional-properties=supportsES6=true,npmName=eve-esi-client,npmVersion=1.0.0
      - name: Commit and Push Changes
        run: |
          echo "Current branch: ${GITHUB_REF#refs/heads/}"
          echo "Current repository: $GITHUB_REPOSITORY"
          git status
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/api/esi
          git diff --staged --quiet || git commit -m "chore: update ESI API client"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
