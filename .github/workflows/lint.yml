name: Lint
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # 如果是由 ESI Generator 触发的，则只在 ESI Generator 成功时运行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
