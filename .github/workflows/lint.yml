name: Lint
on:
  push:
  pull_request:
  workflow_run:
    workflows: ["ESI API Generator"]
    types:
      - completed

jobs:
  lint:
    # 如果是由 ESI Generator 触发的，则只在 ESI Generator 成功时运行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Format code
        run: npm run format
      - name: Run ESLint
        run: npm run lint
      # 如果是由 ESI Generator 触发的，也需要提交格式化的更改
      - name: Commit format changes
        if: github.event_name == 'workflow_run'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --staged --quiet || git commit -m "style: format code after ESI update"
          git push