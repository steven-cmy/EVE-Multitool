name: Lint
on:
  - push
  - pull_request
jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Format code
        run: npm run format
      - name: Run ESLint
        run: npm run lint